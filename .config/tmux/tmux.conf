set -as terminal-features ',xterm*:RGB:usstyle'
set-option -g default-terminal "tmux-256color"
# Override sensible's 500ms default for snappier vim/escape response
set-option -s escape-time 0

set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

setw -g mouse on
set -g pane-border-status bottom
set -g pane-border-format " [ ###P #T ] "
set-option -g status-position top

set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'kenos1/tmux-cht-sh'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'Nybkox/tmux-ukiyo'
set -g @plugin 'tmux-plugins/tmux-cpu'
# ukiyo's gruvbox is the original palette; the overrides pull every semantic
# color onto Gruvbox Material to match nvim, hyprland and noctalia
set -g @ukiyo-theme "gruvbox/dark"
set -g @ukiyo-color-text "#d4be98"
set -g @ukiyo-color-bg-bar "#32302f"
set -g @ukiyo-color-bg-pane "#282828"
set -g @ukiyo-color-highlight "#45403d"
set -g @ukiyo-color-selection "#5a524c"
set -g @ukiyo-color-info "#7daea3"
set -g @ukiyo-color-accent "#a9b665"
set -g @ukiyo-color-notice "#d8a657"
set -g @ukiyo-color-error "#ea6962"
set -g @ukiyo-color-muted "#89b482"
set -g @ukiyo-color-alert "#e78a4e"
set -g @ukiyo-battery-label false
set -g @ukiyo-show-battery-status true
set -g @ukiyo-show-fahrenheit true

set -g @plugin 'tmux-plugins/tpm'

unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

bind r source-file ~/.config/tmux/tmux.conf
set -g base-index 1
set -g renumber-windows on
setw -g monitor-activity on

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R
bind -r v split-window -h
bind -r n split-window -v
bind -r O select-window -t :logs
bind -r D select-window -t :deploy
bind -r E select-window -t :editor

# Resize the current pane using Alt + direction
bind -r K resize-pane -U 5
bind -r J resize-pane -D 5
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5

# forget the find window.  That is for chumps
bind -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

bind -r i run-shell "tmux neww tmux-cht.sh"

bind -r C run-shell "~/.local/bin/tmux-sessionizer ~/projects/bank/"
bind -r B run-shell "~/.local/bin/tmux-sessionizer ~/projects/ref"
# Install TPM and the plugins on first start (a plain `stow .` doesn't run step_tmux)
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Override theme border colors (must be after TPM)
set -g pane-border-style "fg=#5a524c"
set -g pane-active-border-style "fg=#a9b665"
