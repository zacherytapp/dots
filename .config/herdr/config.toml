onboarding = false

[theme]
name = "gruvbox"
auto_switch = false

# Built-in "gruvbox" is the original palette; [theme.custom] (not .dark, which
# needs auto_switch) layers the Material colors over it.
[theme.custom]
panel_bg = "#282828"
sidebar_bg = "#282828"
active_row_bg = "#32302f"
selection_bg = "#45403d"
surface0 = "#32302f"
surface1 = "#45403d"
surface_dim = "#1b1b1b"
overlay0 = "#7c6f64"
overlay1 = "#928374"
text = "#d4be98"
subtext0 = "#a89984"
red = "#ea6962"
green = "#a9b665"
yellow = "#d8a657"
blue = "#7daea3"
teal = "#89b482"
peach = "#e78a4e"
mauve = "#d3869b"
accent = "#a9b665"

[keys]
prefix = "ctrl+space"

reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

detach = ["prefix+q", "prefix+d"]

focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"

swap_pane_left = "prefix+ctrl+h"
swap_pane_down = "prefix+ctrl+j"
swap_pane_up = "prefix+ctrl+k"
swap_pane_right = "prefix+ctrl+l"

split_vertical = "prefix+v"
split_horizontal = ["prefix+n", "prefix+minus"]

new_tab = "prefix+c"
previous_tab = "prefix+p"
next_tab = "prefix+ctrl+n"
switch_tab = "prefix+1..9"
switch_workspace = "prefix+shift+1..9"
rename_tab = "prefix+shift+t"
close_tab = "prefix+shift+x"
last_pane = "prefix+^"

close_pane = "prefix+x"
rename_pane = "prefix+shift+p"
zoom = "prefix+z"
copy_mode = "prefix+["
edit_scrollback = "prefix+e"

workspace_picker = ["prefix+w", "prefix+s"]
goto = "prefix+g"
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+ctrl+x"
toggle_sidebar = "prefix+b"

[[keys.command]]
key = "prefix+f"
type = "popup"
command = "~/.config/herdr/scripts/sessionizer.sh"
description = "project sessionizer"
width = "70%"
height = "60%"

[[keys.command]]
key = "prefix+shift+c"
type = "shell"
command = "~/.config/herdr/scripts/sessionizer.sh ~/Projects/bank"
description = "open ~/Projects/bank"

[[keys.command]]
key = "prefix+shift+b"
type = "shell"
command = "~/.config/herdr/scripts/sessionizer.sh ~/Projects/ref"
description = "open ~/Projects/ref"

[[keys.command]]
key = "prefix+i"
type = "popup"
command = "~/.config/herdr/scripts/cht.sh"
description = "cheat sheets (cht.sh)"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+shift+o"
type = "shell"
command = "~/.config/herdr/scripts/goto-tab.sh logs"
description = "go to logs tab"

[[keys.command]]
key = "prefix+shift+d"
type = "shell"
command = "~/.config/herdr/scripts/goto-tab.sh deploy"
description = "go to deploy tab"

[[keys.command]]
key = "prefix+shift+e"
type = "shell"
command = "~/.config/herdr/scripts/goto-tab.sh editor"
description = "go to editor tab"

[ui]
tab_bar_position = "top"

pane_borders = "auto"
pane_outer_borders = false
pane_gaps = false
pane_scrollbars = false

show_agent_labels_on_pane_borders = true

mouse_capture = true
copy_on_select = true

prompt_new_tab_name = false

accent = "#a9b665"

tab_bar_right = [
  { type = "zoom" },
  { type = "command", command = "~/.config/herdr/scripts/status.sh", interval_seconds = 5, timeout_seconds = 3 },
  { type = "datetime", format = "%a %b %d %H:%M" },
]
tab_bar_right_separator = "  "
