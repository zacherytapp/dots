# Package lists for the CachyOS setup.
# Repo packages go through pacman, AUR_PACKAGES through paru.
# The base system (kernel, bootloader, drivers, firmware, audio, snapper) comes
# from the CachyOS installer and isn't listed here.

BASE=(
  base-devel
  git
  git-lfs
  curl
  wget
  rsync
  unzip
  unrar
  jq
  man-db
  man-pages
  less
  openssh
  gnupg
  pass
  btop
  fastfetch
  duf
  glances
  plocate
  pacman-contrib
  reflector
  networkmanager
  networkmanager-openvpn
  wireguard-tools
  bluez
  bluez-utils
)

SHELL_TOOLS=(
  zsh
  cachyos-zsh-config
  kitty
  ghostty
  tmux
  github-cli
  lazygit
  git-delta
  fzf
  ripgrep
  fd
  bat
  stow
  ctags
  vim
  neovim
  python-pynvim
  tree-sitter-cli
  cmake
  gettext
  wl-clipboard
  opencode
)

LANGUAGES=(
  go
  jdk-openjdk
  ruby
  perl
  php
  php-apache
  composer
  python
  python-pip
  python-pipx
  python-websockets
  uv
)

CONTAINERS=(
  docker
  docker-compose
  docker-buildx
  lazydocker
  ansible
  opentofu
  terraform
  tailscale
)

# The Hyprland + Noctalia session is installed by the `desktop` step from
# ../desktop/desktop.sh (DESKTOP_PKGS_CACHY), after its pre-install checks.
DESKTOP=(
  xdg-user-dirs
  playerctl
  pavucontrol
)

APPS=(
  firefox
  thunderbird
  obsidian
  discord
  libreoffice-fresh
  remmina
  nautilus
  meld
  gimp
  darktable
  digikam
  opencv
  vlc
  vlc-plugins-all
  gpu-screen-recorder
  flatpak
)

# ghostty and kitty configs use JetBrainsMono Nerd, Symbols Nerd, Fira Code and
# Maple Mono (AUR); MesloLGS Nerd is the powerlevel10k font
FONTS=(
  noto-fonts
  noto-fonts-cjk
  noto-fonts-emoji
  ttf-jetbrains-mono-nerd
  ttf-nerd-fonts-symbols
  ttf-nerd-fonts-symbols-mono
  ttf-fira-code
  ttf-firacode-nerd
  ttf-meslo-nerd
  ttf-dejavu
  ttf-liberation
  ttf-opensans
)

PRINTING=(
  cups
  cups-filters
  cups-pdf
  ghostscript
  gutenprint
  foomatic-db
  foomatic-db-engine
  foomatic-db-ppds
  foomatic-db-gutenprint-ppds
  foomatic-db-nonfree
  foomatic-db-nonfree-ppds
  system-config-printer
)

SECURITY=(
  ufw
  ufw-extras
  fail2ban
  avahi
  nss-mdns
)

CACHY_EXTRAS=(
  cachy-update
  cachyos-samba-settings
  dmemcg-booster
  appmenu-gtk-module
  libdbusmenu-glib
)

AUR_PACKAGES=(
  1password
  google-chrome
  slack-desktop
  spotify
  visual-studio-code-bin
  zoom
  bibata-cursor-theme-bin
  maplemono-ttf
)

# pnpm global packages
PNPM_GLOBALS=(
  @salesforce/cli
  @salesforce/lwc-language-server
  stylelint
)

FLATPAKS=(
  com.github.tchx84.Flatseal
)

# opt-in: ./run.sh gaming
GAMING=(
  cachyos-gaming-meta
  cachyos-gaming-applications
  protonup-qt
)

# opt-in: ./run.sh kvm
KVM=(
  qemu-desktop
  libvirt
  virt-manager
  edk2-ovmf
  swtpm
  dnsmasq
  openbsd-netcat
  libguestfs
)
